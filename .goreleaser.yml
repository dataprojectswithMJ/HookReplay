# GoReleaser — builds + publishes the CLI to GitHub Releases, with a Homebrew
# formula and deb/rpm packages. Run via the release workflow (on tag push).
version: 2

builds:
  - id: hookreplay
    main: ./cmd/cli
    binary: hookreplay
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - format: tar.gz
    name_template: >-
      hookreplay_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

nfpms:
  - id: packages
    package_name: hookreplay
    vendor: HookReplay
    homepage: https://github.com/dataprojectswithMJ/HookReplay
    maintainer: HookReplay <support@hookreplay.dev>
    description: Fire provider-accurate, correctly-signed webhooks at localhost and staging.
    license: Proprietary
    formats: [deb, rpm]

brews:
  - name: hookreplay
    repository:
      owner: dataprojectswithMJ
      name: homebrew-tap
    homepage: https://github.com/dataprojectswithMJ/HookReplay
    description: Fire provider-accurate, correctly-signed webhooks at localhost and staging.

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
