# GoReleaser — builds cross-compiled CLI binaries and publishes them to
# GitHub Releases on every tag push (see .github/workflows/release.yml).
version: 2

builds:
  - id: hookreplay
    main: ./cmd/cli
    binary: hookreplay
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - format: tar.gz
    name_template: >-
      hookreplay_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
