services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hookreplay
      POSTGRES_PASSWORD: hookreplay
      POSTGRES_DB: hookreplay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookreplay"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    environment:
      HOOKREPLAY_HTTP_ADDR: ":8080"
      HOOKREPLAY_DATABASE_URL: "postgres://hookreplay:hookreplay@postgres:5432/hookreplay?sslmode=disable"
      HOOKREPLAY_MASTER_KEY: "${HOOKREPLAY_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
      HOOKREPLAY_DEV_API_KEY: "${HOOKREPLAY_DEV_API_KEY:-hrk_dev_local_dev_only_key}"
      HOOKREPLAY_PUBLIC_BASE_URL: "${HOOKREPLAY_PUBLIC_BASE_URL:-http://localhost:8080}"
      HOOKREPLAY_WEB_BASE_URL: "${HOOKREPLAY_WEB_BASE_URL:-http://localhost:3000}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        HOOKREPLAY_API_PROXY: "http://api:8080"
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:

